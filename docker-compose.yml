services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=totika
      - POSTGRES_USER=totika
      - POSTGRES_PASSWORD=totika-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totika"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      # Mount source code for hot reload
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      - ./migrations:/app/migrations
      - ./seed_data:/app/seed_data
      - ./run.py:/app/run.py
      - ./alembic.ini:/app/alembic.ini
      # Persist user data (uploads, backups) — bind mounts to host
      - ./instance:/app/instance
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    environment:
      - FLASK_DEBUG=1
      - FLASK_ENV=development
      - FLASK_RUN_IN_DOCKER=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEFAULT_ADMIN_PASSWORD=admin
      - BEHIND_PROXY=true
      - DATABASE_URL=postgresql://totika:totika-dev-password@db:5432/totika
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
